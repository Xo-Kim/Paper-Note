<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Notes</title>
<!-- 탭 아이콘: 이미지 파일 없이 SVG를 주소(data URI)로 직접 넣음. 흰 종이 위 빨강·파랑 밑줄 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 4h28l14 14v38a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z' fill='%23fff' stroke='%239aa0a8' stroke-width='2'/%3E%3Cpath d='M40 4v10a4 4 0 0 0 4 4h10' fill='%23e4e2dc' stroke='%239aa0a8' stroke-width='2'/%3E%3Crect x='16' y='24' width='30' height='4' rx='2' fill='%231f2328'/%3E%3Crect x='16' y='32' width='22' height='3.5' rx='1.75' fill='%23e5484d'/%3E%3Crect x='16' y='40' width='30' height='4' rx='2' fill='%231f2328'/%3E%3Crect x='16' y='48' width='24' height='3.5' rx='1.75' fill='%232f6fde'/%3E%3C/svg%3E">
<script>/* 테마: 저장된 선택 → 없으면 시스템 설정 */
try { document.documentElement.dataset.theme = localStorage.getItem("pn:theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch {}
</script>
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --ink:#1f2328; --muted:#6b7078; --line:#e4e2dc; --accent:#2f6fde; --side:420px;
  --serif:"Noto Serif KR","AppleMyungjo","Batang","Georgia",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono","Consolas",monospace;
  --shadow:0 12px 40px rgba(0,0,0,.18);
  /* 색상 (밝은 테마) */
  --hover:#efeee9; --hover2:#f7f6f2; --field:#f4f3ee; --fg2:#3d4148; --faint:#a3a6ab; --quote:#c9c6bd;
  --danger:#c4392f; --danger-bg:#fdeceb; --accent-bg:#eef3fd; --accent-bg2:#dce7fb;
  --memo:#7a4a12; --memo-bg:#fff6ea; --tip-bg:#fffdf8; --tip-line:#ecd9bd; --nh:#fff1a8;
  --float:#1f2328; --on-ink:#fff; --ink-hover:#000; --bar-bg:rgba(255,255,255,.95); --drop-bg:rgba(242,246,254,.88);
  --page-filter:none; color-scheme:light;
}
/* 어두운 테마: <html data-theme="dark"> */
:root[data-theme=dark]{
  --bg:#17181b; --panel:#1f2125; --ink:#e6e6e3; --muted:#9a9ea6; --line:#33363c; --accent:#6c9cf0;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --hover:#2a2d32; --hover2:#24272b; --field:#272a2f; --fg2:#c9cbcf; --faint:#6e727a; --quote:#4a4e55;
  --danger:#f07167; --danger-bg:#3a2324; --accent-bg:#22304a; --accent-bg2:#2b3c5c;
  --memo:#f0c48a; --memo-bg:#3a2e1f; --tip-bg:#2a2722; --tip-line:#4d4334; --nh:#665712;
  --float:#33363d; --on-ink:#17181b; --ink-hover:#fff; --bar-bg:rgba(31,33,37,.95); --drop-bg:rgba(23,24,27,.88);
  --page-filter:brightness(.88); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
kbd,.kbtn{font-family:var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel);font-size:10.5px}
.empty-note{color:var(--muted);text-align:center;padding:40px 20px;line-height:1.7}

/* ── 상단 바 ── */
.app{display:grid;grid-template-rows:48px 1fr;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ib{border:0;background:transparent;padding:6px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:hover{background:var(--hover)}
.ib.primary{background:var(--ink);color:var(--on-ink)}
.ib.primary:hover{background:var(--ink-hover)}
.logo{font-weight:700;margin-right:4px}
#title{flex:1;min-width:80px;border:0;background:transparent;font-weight:600;font-size:15px;padding:6px 8px;border-radius:7px;outline:none}
#title:hover,#title:focus{background:var(--hover)}
#status{color:var(--muted);font-size:12px;white-space:nowrap}
#status.err{color:var(--danger)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:36px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:200px;z-index:40;display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--hover)}

/* ── 본문 ── */
main{display:grid;grid-template-columns:1fr 6px var(--side);min-height:0}
#rwrap{position:relative;min-height:0;min-width:0}
#reader{position:absolute;inset:0;overflow:auto}
#doc{max-width:760px;margin:0 auto;padding:40px 48px 50vh;font:17px/1.85 var(--serif);word-break:keep-all;overflow-wrap:anywhere}
#doc ::selection{background:rgba(47,111,222,.22)}
#doc p.blk{margin:0 0 1em}
#doc p.blk.jf{animation:jfb 1.6s}
@keyframes jfb{0%,50%{background:rgba(47,111,222,.14)}100%{background:transparent}}
#doc .jflash{position:absolute;background:rgba(47,111,222,.3);border-radius:3px;animation:jfa 1.6s forwards;pointer-events:none}
@keyframes jfa{0%,55%{opacity:1}100%{opacity:0}}
#doc .pg{font:11px var(--sans);color:var(--muted);text-align:center;margin:28px 0 18px;user-select:none;letter-spacing:.08em}
#doc .pg::before,#doc .pg::after{content:"";display:inline-block;width:60px;height:1px;background:var(--line);vertical-align:middle;margin:0 10px}
mark.an{background:none;color:inherit;cursor:pointer;padding:0;text-decoration:underline 2px;text-underline-offset:4px}
#welcome{max-width:520px;margin:12vh auto;text-align:center;font-family:var(--sans);color:var(--muted);line-height:1.8;padding:0 20px}
#welcome h2{color:var(--ink);font-size:22px;margin-bottom:6px}
/* PDF 원문 보기: canvas + 선택용 텍스트 레이어 + 밑줄 레이어 */
#doc.pdfmode{max-width:none;padding:20px 24px 40vh;display:flex;flex-direction:column;align-items:flex-start;gap:14px;font-family:var(--sans);width:max-content;min-width:100%}
#doc .page{position:relative;background:#fff;filter:var(--page-filter);box-shadow:0 1px 4px rgba(0,0,0,.14);flex:0 0 auto;margin:0 auto}
#doc .page canvas{position:absolute;inset:0;width:100%;height:100%}
#doc .alayer{position:absolute;inset:0;z-index:1;pointer-events:none}
#doc .pa{position:absolute;mix-blend-mode:multiply;border-radius:2px}
/* PDF 어둡게 (다크 모드에서 ◐): 쪽 그림은 색 반전, 사진 영역(canvas.keep)은 원래 색 그대로 */
:root[data-theme=dark] #doc.pdfdark .page{background:#000}
:root[data-theme=dark] #doc.pdfdark .page canvas.base{filter:invert(1) hue-rotate(180deg)}
:root[data-theme=dark] #doc.pdfdark .pa{mix-blend-mode:normal}
:root:not([data-theme=dark]) #vt [data-dark]{display:none}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;-webkit-text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(47,111,222,.3)}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer .endOfContent.active{top:0}
#vt{position:absolute;top:10px;right:26px;z-index:6}
#vt .bar{display:flex;gap:2px;align-items:center;background:var(--bar-bg);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.08);height:34px}
#vt button{border:0;background:none;border-radius:6px;padding:4px 9px;font-size:12.5px}
#vt button.on{background:var(--ink);color:var(--on-ink)}
#vt .sep{width:1px;height:16px;background:var(--line);margin:0 3px}
.resizer{cursor:col-resize;border-left:1px solid var(--line)}
.resizer:hover,.resizer.drag{background:rgba(47,111,222,.15)}

/* ── 사이드: 탭 · 주석 목록 ── */
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.pane{flex:1;overflow:auto;min-height:0;display:none}
.pane.on{display:block}
.alist{padding:12px}
.ai{position:relative;border:1px solid var(--line);border-left-width:4px;border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ai:hover{background:var(--hover2)}
.ai .pn{font-size:11px;color:var(--muted);margin-bottom:3px}
.ai .q{font:13.5px var(--serif);color:var(--fg2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ai .w{font:600 16px var(--serif)}
.ai .c{margin-top:6px;font-size:13px;color:var(--memo);background:var(--memo-bg);border-radius:6px;padding:5px 8px;white-space:pre-wrap}
.ai .adel{position:absolute;top:8px;right:8px;border:0;background:var(--danger-bg);color:var(--danger);border-radius:6px;padding:3px 8px;font-size:12px;opacity:0}
.ai:hover .adel{opacity:1}
.hint{font-size:11.5px;color:var(--muted);padding:8px 22px;border-top:1px solid var(--line);background:var(--hover2)}

/* ── 노트 편집기 (블록) ── */
#notes{padding:18px 22px 40vh 30px;font-size:14.5px;line-height:1.7;min-height:100%;cursor:text}
#notes.selecting{user-select:none}
.nb{position:relative;border-radius:5px;min-height:1.7em;margin:1px 0}
.nb.r{padding:2px 4px}
.nb.r:hover{background:var(--hover2)}
.nb.sel{background:rgba(47,111,222,.13)!important}
.nb.sel img{outline:2px solid rgba(47,111,222,.55);outline-offset:1px}
.nb.dragging{opacity:.4}
.nb.drop-b{box-shadow:0 -2px 0 var(--accent)}
.nb.drop-a{box-shadow:0 2px 0 var(--accent)}
.nb.ph::before{content:attr(data-ph);color:var(--faint);position:absolute;left:4px;top:2px;pointer-events:none}
.nb .hd{position:absolute;top:3px;opacity:0;cursor:grab;color:var(--faint);user-select:none;font-size:12px;letter-spacing:-2px;padding:0 4px;border-radius:4px;line-height:1.6}
.nb:hover>.hd,.nb.e>.hd{opacity:1}
.nb .hd:hover{background:var(--hover);color:var(--muted)}
.nb textarea{width:100%;border:0;outline:none;resize:none;background:var(--field);border-radius:5px;padding:2px 4px;font:inherit;line-height:1.7;overflow:hidden;display:block}
.nb .erow{display:flex;align-items:flex-start;gap:7px}
.nb .erow textarea{flex:1}
.nb .emk,.nb .li .mk{flex:0 0 auto;min-width:14px;text-align:center;color:var(--muted)}
.nb .emk{padding-top:2px}
.nb .emk input{margin:6px 0 0}
.nb.k-h1 textarea{font-size:1.5em;font-weight:700;line-height:1.35}
.nb.k-h2 textarea{font-size:1.25em;font-weight:700;line-height:1.35}
.nb.k-h3 textarea{font-size:1.08em;font-weight:700;line-height:1.4}
.nb.k-q textarea{border-left:3px solid var(--quote);border-radius:0 5px 5px 0;padding-left:10px;color:var(--fg2)}
.nb.k-code textarea{font-family:var(--mono);font-size:13px}
.nb .prev{padding:4px 6px 2px;border-left:2px solid var(--line);margin:4px 0 2px 2px;color:var(--fg2)}
.nb h1,.nb h2,.nb h3{margin:.5em 0 .1em;line-height:1.35}
.nb h1{font-size:1.5em}.nb h2{font-size:1.25em}.nb h3{font-size:1.08em}
.nb p{margin:0}
.nb blockquote{margin:0;padding:1px 0 1px 12px;border-left:3px solid var(--quote);color:var(--fg2)}
.nb pre{background:var(--field);border-radius:6px;padding:10px 12px;overflow:auto;margin:2px 0;font-size:12.5px}
.nb code{font-family:var(--mono);font-size:.9em;background:var(--field);padding:1px 4px;border-radius:4px}
.nb pre code{background:none;padding:0}
.nb hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.nb .li{display:flex;gap:7px}
.nb .li input{margin:5px 0 0}
.nb .li.done .tx{color:var(--faint);text-decoration:line-through}
.nb a{color:var(--accent)}
.nb a.jump{font-size:11.5px;background:var(--accent-bg);border-radius:5px;padding:1px 6px;margin-left:5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.nb a.jump:hover{background:var(--accent-bg2)}
.nb mark.nh{background:var(--nh);color:inherit;border-radius:2px}
.nb img{max-width:100%;border-radius:6px;display:block;margin:4px 0}
.nb img.miss{color:var(--danger);font-size:12px}
.m.pending{font-family:var(--mono);font-size:.9em;color:#7a4fb5}
.m.err{color:var(--danger)}
.m mjx-container{margin:0!important}
.mdisp{text-align:center;margin:6px 0;overflow-x:auto}

/* ── 떠 있는 것들: 선택 툴바 · 툴팁 · 밑줄 편집 팝업 ── */
#tb{position:fixed;z-index:50;display:none;background:var(--float);color:#fff;border-radius:10px;padding:4px;gap:2px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#tb.on{display:flex}
#tb button{border:0;background:none;color:#fff;border-radius:7px;padding:5px 8px;font-size:13px}
#tb button:hover{background:rgba(255,255,255,.14)}
#tb .dot{width:24px;height:24px;padding:0;display:grid;place-items:center}
#tb .dot i{width:16px;height:4px;border-radius:2px;display:block;margin-top:8px}
#tb .sep{width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 3px}
#tip{position:fixed;z-index:55;display:none;max-width:320px;background:var(--tip-bg);border:1px solid var(--tip-line);border-radius:9px;padding:9px 11px;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13px;line-height:1.55;white-space:pre-wrap;pointer-events:none}
#tip .tq{color:var(--muted);font-size:11.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip .tc+.tc{border-top:1px dashed var(--tip-line);margin-top:6px;padding-top:6px}
#pop{position:fixed;z-index:60;display:none;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px}
#pop .q{font:12.5px var(--serif);color:var(--muted);margin-bottom:8px;max-height:3.2em;overflow:hidden}
#pop .row{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
#pop .cdot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
#pop .cdot.on{border-color:var(--ink)}
#pop textarea{width:100%;min-height:80px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical;outline:none;font-size:13.5px;line-height:1.55}
#pop textarea:focus{border-color:var(--accent)}
#pop .acts{display:flex;justify-content:space-between;margin-top:8px}
#pop .acts button{border:0;background:var(--hover);border-radius:7px;padding:5px 10px;font-size:12.5px}
#pop .acts .del{color:var(--danger);background:var(--danger-bg)}

/* ── 서랍 · 대화상자 ── */
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.32);z-index:70;display:none}
.scrim.on{display:block}
#drawer{position:fixed;left:0;top:0;bottom:0;width:340px;background:var(--panel);z-index:71;transform:translateX(-100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:4px 0 30px rgba(0,0,0,.1)}
#drawer.on{transform:none}
#drawer h3{margin:0;padding:16px 18px 10px;font-size:15px}
#lib{flex:1;overflow:auto;padding:0 10px 14px}
.lp{display:flex;align-items:center;gap:6px;padding:10px;border-radius:9px;cursor:pointer}
.lp:hover{background:var(--hover)}
.lp.cur{background:var(--accent-bg)}
.lp .t{flex:1;min-width:0}
.lp .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .t small{color:var(--muted)}
.lp .x{border:0;background:none;color:var(--muted);border-radius:6px;padding:3px 7px;font-size:12px;visibility:hidden}
.lp:hover .x,.lp .x.armed{visibility:visible}
.lp .x.armed{background:var(--danger-bg);color:var(--danger)}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border-radius:14px;z-index:72;padding:22px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.on{display:block}
.dlg h3{margin:0 0 14px}
.dlg label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.dlg input[type=text],.dlg textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
.dlg textarea{height:180px;resize:vertical;font-family:var(--serif);line-height:1.6}
#drop{border:1.5px dashed var(--quote);border-radius:11px;padding:20px;text-align:center;color:var(--muted);cursor:pointer}
#drop.over{border-color:var(--accent);background:var(--accent-bg)}
#drop b{color:var(--ink)}
.mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.mfoot .msg{color:var(--muted);font-size:12.5px}
#kmodal{width:min(440px,94vw)}
#kmodal .ksub{color:var(--muted);font-size:12.5px;line-height:1.6;margin:-8px 0 12px}
.krow{display:flex;align-items:center;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line)}
.krow .kl{display:flex;align-items:center;gap:8px}
.krow .kl i{width:12px;height:12px;border-radius:50%}
.kbtn{min-width:96px;background:var(--hover2);border-radius:7px;border-bottom-width:1px;padding:5px 10px;font-size:12.5px}
.kbtn.rec{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.kbtn.none{color:var(--faint)}
/* 찾기 (Ctrl+F) */
#findbar{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px 6px}
#findbar[hidden]{display:none}
#fq{width:240px;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:5px 8px;outline:none}
#fq:focus{border-color:var(--accent)}
#fcount{min-width:48px;text-align:center;font-size:12px;color:var(--muted)}
#findbar button{border:0;background:none;border-radius:6px;padding:4px 8px}
#findbar button:hover{background:var(--hover)}
#findbar .fscope{display:flex;gap:1px;background:var(--hover);border-radius:8px;padding:2px}
#findbar .fscope button{padding:3px 8px;font-size:12px;color:var(--muted);white-space:nowrap}
#findbar .fscope button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#findbar .fscope small{margin-left:3px;opacity:.75}
::highlight(pn-find){background-color:rgba(255,196,0,.6)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--float);color:#fff;padding:9px 16px;border-radius:9px;z-index:90;font-size:13px;display:none}
#toast.on{display:block}
#dropov{position:fixed;inset:10px;border:2.5px dashed var(--accent);border-radius:16px;background:var(--drop-bg);z-index:95;display:none;place-items:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none}
#dropov.on{display:grid}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 45vh}
  .resizer,.hide-sm{display:none}
  aside{border-top:1px solid var(--line)}
  #doc{padding:24px 20px 30vh}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="ib" id="bLib" title="논문 목록">☰</button>
    <span class="logo hide-sm">Paper Notes</span>

<script>
(() => {
"use strict";

/* ════════════════ 1. 유틸 · 상수 ════════════════ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};
function toast(msg, ms = 2200) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), ms);
}
const loadScript = src => new Promise((res, rej) => {
  const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src));
  document.head.appendChild(s);
});
const restartAnim = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
// 떠 있는 요소를 기준 사각형 아래(공간 없으면 위)에 화면 안으로 배치
function place(el, r, gap = 8, minTop = 8) {
  const w = el.offsetWidth, h = el.offsetHeight;
  let y = r.bottom + gap; if (y + h > innerHeight - 8) y = Math.max(minTop, r.top - h - gap);
  el.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + "px"; el.style.top = y + "px";
}

// 밑줄 색 = 분류. 빨강 → 개념(필기), 파랑 → 단어(뜻), 초록 → 일반 밑줄
const COLORS = { r: {line: "#e5484d"}, b: {line: "#2f6fde"}, g: {line: "#2e9e4a"} };
const hasMemo = a => a.color === "r" || a.color === "b";
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const MATHJAX = "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js";
const DATA_DIR = "papers";

/* ════════════════ 2. 저장소 ════════════════
 * 기본은 IndexedDB(브라우저 안). 폴더를 연결하면(File System Access API, Chrome/Edge)
 *   <선택 위치>/papers/<제목>/{paper.json, <제목>.md, original.pdf, images/}
 * 로 저장. .md는 Notion 가져오기용, paper.json은 앱 데이터. */
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const safeTitle = t => (t || "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "_").replace(/^[.\s]+|[.\s]+$/g, "").slice(0, 60) || "paper";
async function readJson(dh, name) { try { return JSON.parse(await (await (await dh.getFileHandle(name)).getFile()).text()); } catch { return null; } }
async function writeFile(dh, name, data) {
  const w = await (await dh.getFileHandle(name, {create: true})).createWritable(); await w.write(data); await w.close();
}

const Store = {
  idb: null, dir: null, pendingDir: null, texts: {}, urls: new Map(),
  os(name, rw) { return this.idb.transaction(name, rw ? "readwrite" : "readonly").objectStore(name); },

  async init() {
    const r = indexedDB.open("paper-notes", 3);
    r.onupgradeneeded = () => ["papers", "texts", "kv", "imgs"].forEach(n =>
      r.result.objectStoreNames.contains(n) || r.result.createObjectStore(n, n === "papers" ? {keyPath: "id"} : undefined));
    this.idb = await idbReq(r);
    navigator.storage?.persist?.()?.catch(() => {});
    if (!window.showDirectoryPicker) return;
    const h = await idbReq(this.os("kv").get("dir")).catch(() => null);   // 이전에 연결한 폴더
    if (h) (await h.queryPermission({mode: "readwrite"})) === "granted" ? this.dir = h : this.pendingDir = h;
  },

  async connect(pick) {
    // 맨 처음 연결할 때만 브라우저에 있던 논문을 폴더로 옮김. 다시 연결(재허용)할 때 또 옮기면
    // 폴더에서 지운 논문이 브라우저 사본에서 되살아남
    const first = !this.dir && !this.pendingDir;
    let h = pick ? null : this.pendingDir;
    if (h) { if ((await h.requestPermission({mode: "readwrite"})) !== "granted") return false; }
    else h = await (await showDirectoryPicker({mode: "readwrite", id: "paper-notes"})).getDirectoryHandle(DATA_DIR, {create: true});
    await idbReq(this.os("kv", 1).put(h, "dir"));
    const local = first ? await idbReq(this.os("papers").getAll()) : [];
    this.dir = h; this.pendingDir = null; this.urls.clear();
    const have = new Set((await this.list()).map(p => p.id));
    for (const m of local) {
      if (have.has(m.id)) continue;
      m.dir = await this.uniqueDir(safeTitle(m.title));
      this.texts[m.id] = (await idbReq(this.os("texts").get(m.id))) || [];
      await this.saveMeta(m);
      for (const k of await idbReq(this.os("imgs").getAllKeys(IDBKeyRange.bound(m.id + "/", m.id + "/￿")))) {
        const name = k.slice(m.id.length + 1);
        await this.putFile(m, name.startsWith("__file__/") ? name.slice(9) : "images/" + name, await idbReq(this.os("imgs").get(k)));
      }
    }
    return true;
  },

  async uniqueDir(base) {
    const names = new Set(); for await (const n of this.dir.keys()) names.add(n);
    let n = base, k = 2; while (names.has(n)) n = `${base} (${k++})`;
    return n;
  },

  async list() {
    if (!this.dir) return idbReq(this.os("papers").getAll());
    const out = [];
    for await (const [name, h] of this.dir.entries()) {
      if (h.kind !== "directory") continue;
      const o = await readJson(h, "paper.json");
      let m = o?.meta, blocks = o?.blocks;
      if (!m) { m = await readJson(h, "meta.json"); blocks = await readJson(h, "text.json"); }   // 이전 버전 형식
      if (!m?.id || m.deleted) continue;   // deleted: 이전 버전에서 '목록에서만 숨김' 처리된 논문
      m.dir = name; this.texts[m.id] = blocks || []; out.push(m);
    }
    return out;
  },

  async saveMeta(m) {
    if (!this.dir) return idbReq(this.os("papers", 1).put(m));
    const dh = await this.dir.getDirectoryHandle(m.dir, {create: true});
    await writeFile(dh, "paper.json", JSON.stringify({v: 2, meta: m, blocks: this.texts[m.id] || []}));
    await writeFile(dh, m.dir + ".md", exportMd(m));
  },
  async saveText(m, blocks) {   // 폴더 모드에서는 saveMeta가 paper.json에 함께 기록
    this.texts[m.id] = blocks;
    if (!this.dir) await idbReq(this.os("texts", 1).put(blocks, m.id));
  },
  async loadText(m) {
    return this.dir ? this.texts[m.id] || [] : (await idbReq(this.os("texts").get(m.id))) || [];
  },

  // 첨부 파일. path = "original.pdf" 또는 "images/<파일>" (IndexedDB 키는 이전 버전과 같은 형식)
  idbKey: (m, path) => m.id + "/" + (path.startsWith("images/") ? path.slice(7) : "__file__/" + path),
  async fsDir(m, path, create) {
    const parts = path.split("/");
    let dh = await this.dir.getDirectoryHandle(m.dir, {create});
    if (parts.length > 1) dh = await dh.getDirectoryHandle(parts[0], {create});
    return [dh, parts.at(-1)];
  },
  async putFile(m, path, blob) {
    if (!this.dir) return idbReq(this.os("imgs", 1).put(blob, this.idbKey(m, path)));
    const [dh, name] = await this.fsDir(m, path, true); await writeFile(dh, name, blob);
  },
  async getFile(m, path) {
    try {
      if (!this.dir) return (await idbReq(this.os("imgs").get(this.idbKey(m, path)))) || null;
      const [dh, name] = await this.fsDir(m, path, false); return await (await dh.getFileHandle(name)).getFile();
    } catch { return null; }
  },
  async imageURL(m, name) {
    const k = m.id + "/" + name;
    if (!this.urls.has(k)) {
      const b = await this.getFile(m, "images/" + name); if (!b) throw new Error("not found");
      this.urls.set(k, URL.createObjectURL(b));
    }
    return this.urls.get(k);
  },

  async remove(m) {   // 완전 삭제: 폴더 모드면 논문 폴더째 지우고, 브라우저에 남은 사본도 함께 지움
    if (this.dir) await this.dir.removeEntry(m.dir, {recursive: true}).catch(e => { if (e.name !== "NotFoundError") throw e; });
    await idbReq(this.os("papers", 1).delete(m.id));
    await idbReq(this.os("texts", 1).delete(m.id));
    await idbReq(this.os("imgs", 1).delete(IDBKeyRange.bound(m.id + "/", m.id + "/￿")));
  },
};

/* ════════════════ 3. 상태 · 자동 저장 ════════════════ */
let papers = [];     // 논문 목록(meta)
let meta = null;     // 열린 논문 {id, title, created, updated, src, annots, notes, dir?}
let blocks = [];     // 본문 [{k:'p'|'g', t}]  (g = 쪽 구분선)
let lastColor = "r";
let saveTimer = null, saving = false, dirty = false;

function setStatus(txt, err) { const s = $("#status"); s.textContent = txt; s.classList.toggle("err", !!err); }
function idleStatus() { setStatus(Store.dir ? "저장됨 · 폴더" : "저장됨 · 브라우저"); updDirBtn(); }
const schedule = ms => { clearTimeout(saveTimer); saveTimer = setTimeout(flush, ms); };
function touch() { if (!meta) return; meta.updated = Date.now(); dirty = true; setStatus("편집 중…"); schedule(700); histRecord(); }

// 실행 취소 / 다시 실행 (Ctrl+Z / Ctrl+Shift+Z · Ctrl+Y): 노트·밑줄 상태를 통째로 기록
// 연속 입력은 0.5초 멈췄을 때 한 단계로 묶음. 논문을 열 때마다 새로 시작
const hist = {undo: [], redo: [], timer: null};
const snap = () => JSON.stringify({notes: meta.notes, annots: meta.annots});
function histReset() { clearTimeout(hist.timer); hist.undo = meta ? [snap()] : []; hist.redo = []; }
function histRecord() { clearTimeout(hist.timer); hist.timer = setTimeout(histCommit, 500); }
function histCommit() {
  clearTimeout(hist.timer);
  if (!meta || !hist.undo.length) return;
  const s = snap(); if (s === hist.undo.at(-1)) return;
  hist.undo.push(s); if (hist.undo.length > 200) hist.undo.shift();
  hist.redo = [];
}
function histGo(back) {
  if (!meta) return;
  histCommit();
  if (back ? hist.undo.length < 2 : !hist.redo.length) return toast(back ? "더 되돌릴 게 없어요" : "다시 실행할 게 없어요");
  if (back) hist.redo.push(hist.undo.pop()); else hist.undo.push(hist.redo.pop());
  const o = JSON.parse(hist.undo.at(-1));
  meta.notes = o.notes; meta.annots = o.annots;
  ed = -1; selSet.clear(); hidePop(); hideTb();
  if (isPdfView()) doc.querySelectorAll(".page[data-r]").forEach(d => drawPdfAnnots(+d.dataset.page)); else blocks.forEach((_, i) => renderBlock(i));
  renderNotes(); renderLists(); touch();   // 같은 상태라 기록은 늘지 않음
}
async function flush() {
  if (!meta || !dirty) return;
  if (saving) return schedule(400);
  saving = true; dirty = false; setStatus("저장 중…");
  try { await Store.saveMeta(meta); idleStatus(); }
  catch { dirty = true; setStatus("저장 실패 — 다시 시도 중", true); schedule(3000); }
  finally { saving = false; }
}
addEventListener("beforeunload", () => { if (dirty) flush(); });

/* ════════════════ 4. 본문 보기 (텍스트) ════════════════ */
const doc = $("#doc"), reader = $("#reader");
let pdfDoc = null, viewMode = "text", pdfScale = 1, pdfObs = null, docReady = Promise.resolve();
let pdfZoom = +ls.get("pn:zoom"); if (!(pdfZoom >= .5 && pdfZoom <= 3)) pdfZoom = 1;
let pdfDark = ls.get("pn:pdfdark") !== "0";   // 다크 모드에서 PDF 어둡게 (기본 켬)
const isPdfView = () => viewMode === "pdf" && !!pdfDoc;

function welcome(title, body, btnSel, btnLabel) {
  doc.innerHTML = `<div id="welcome"><h2>${title}</h2>${body}<br><br><button class="ib primary">${btnLabel}</button></div>`;
  doc.querySelector("#welcome button").onclick = () => $(btnSel).click();
}

function renderDoc() {
  hideTb(); hidePop(); updVt();
  if (!meta) {
    doc.classList.remove("pdfmode");
    return Store.pendingDir
      ? welcome("저장 폴더 접근을 허용해 주세요", "보안을 위해 브라우저를 다시 열 때마다 한 번씩 허용이 필요해요.", "#bDir", "📁 폴더 다시 연결")
      : welcome("논문을 읽으면서 바로 표시하고 메모하세요",
          "PDF를 이 화면에 끌어놓거나, 본문을 붙여넣으면 시작할 수 있어요.<br>문장을 드래그하면 밑줄 · 노트 인용 메뉴가 뜹니다.", "#bNew", "＋ 첫 논문 추가");
  }
  if (isPdfView()) { docReady = renderPdfPages(); return; }
  doc.classList.remove("pdfmode");
  const frag = document.createDocumentFragment();
  blocks.forEach((b, i) => {
    const el = document.createElement(b.k === "g" ? "div" : "p");
    el.className = b.k === "g" ? "pg" : "blk"; el.dataset.b = i;
    if (b.k === "g") el.textContent = b.t;
    frag.appendChild(el);
  });
  doc.replaceChildren(frag);
  blocks.forEach((_, i) => renderBlock(i));
}

const blockEl = i => doc.querySelector(`[data-b="${i}"]`);
// 문단 안의 밑줄 구간을 <mark>로 감쌈 (겹치면 나중에 그은 색)
function renderBlock(i) {
  const el = blockEl(i); if (!el || blocks[i].k === "g") return;
  const t = blocks[i].t, rs = [];
  for (const a of meta.annots) for (const r of a.ranges || []) if (r.b === i) rs.push({...r, a});
  if (!rs.length) { el.textContent = t; return; }
  const cuts = [...new Set([0, t.length, ...rs.flatMap(r => [r.s, r.e])])].sort((x, y) => x - y);
  let h = "";
  for (let k = 0; k < cuts.length - 1; k++) {
    const s = cuts[k], e = cuts[k + 1], seg = esc(t.slice(s, e)), cov = rs.filter(r => r.s <= s && r.e >= e);
    h += !cov.length ? seg
      : `<mark class="an" data-ids="${cov.map(r => r.a.id).join(" ")}" style="text-decoration-color:${COLORS[cov.at(-1).a.color].line}">${seg}</mark>`;
  }
  el.innerHTML = h;
}
const rerender = a => a.pdf ? new Set(a.pdf.map(r => r.p)).forEach(drawPdfAnnots) : new Set(a.ranges.map(r => r.b)).forEach(renderBlock);
const annotsOf = mark => { const ids = mark.dataset.ids.split(" "); return meta.annots.filter(a => ids.includes(a.id)); };

// 텍스트 선택 → [{b:문단, s, e}]
function offsetIn(el, node, off) { const r = document.createRange(); r.setStart(el, 0); r.setEnd(node, off); return r.toString().length; }
function selRanges() {
  const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return null;
  const R = sel.getRangeAt(0); if (!doc.contains(R.commonAncestorContainer)) return null;
  const out = [];
  doc.querySelectorAll("p.blk").forEach(el => {
    if (!R.intersectsNode(el)) return;
    const i = +el.dataset.b, t = blocks[i].t;
    let s = el.contains(R.startContainer) ? offsetIn(el, R.startContainer, R.startOffset) : 0;

/* ════════════════ 5. 본문 보기 (PDF 원문) ════════════════
 * 원본 쪽(canvas) + 선택 가능한 텍스트 레이어 + 밑줄 레이어(쪽 기준 0~1 좌표) */

function updVt() {

  vt.querySelectorAll("[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === viewMode));
  vt.querySelectorAll("[data-z],[data-dark],.sep").forEach(b => b.style.display = viewMode === "pdf" ? "" : "none");

}
function setView(v) {
  if (!meta) return;
  viewMode = v; ls.set("pn:view:" + meta.id, v); hideTip(); reader.scrollTop = 0; renderDoc();
  if (!$("#findbar").hidden) docReady.then(runFind);   // 찾기 중이면 바뀐 보기에서 다시 찾기
}
$("#vt").addEventListener("click", e => {

async function renderPdfPages() {

/* ── PDF 어둡게: 쪽 전체는 CSS로 색 반전, 사진은 원래 색 ──
 * 사진 영역만 반전 안 된 캔버스(canvas.keep)에 복사해 위에 겹침.
 * 흰 바탕 그래프·도표 이미지는 글자처럼 반전하는 게 자연스러워서 그대로 반전되게 둠 */
async function keepPhotos(cv, page, vp, dpr) {

    .map(parts => parts.map(r => r.map(v => Math.round(v * dpr)))).filter(parts => isPhoto(ctx, parts)).flat();

// 쪽 안의 그림 영역 → 그림마다 [x, y, w, h] 이미지 조각 목록 (화면 px)
// PDF 그리기 명령을 따라가며 좌표 변환·잘라내기(clip)를 계산하고, 겹치거나 붙은 이미지는 그림 하나로 묶음
// (여러 장으로 된 그림이 조각마다 다르게 보이지 않게). 쪽 대부분을 덮는 그림(스캔본)은 제외 → 스캔 PDF도 어둡게

    const xs = [x0, x1, x0, x1].map((x, i) => m[0] * x + m[2] * (i < 2 ? y0 : y1) + m[4]);
    const ys = [x0, x1, x0, x1].map((x, i) => m[1] * x + m[3] * (i < 2 ? y0 : y1) + m[5]);

    .map(g => g.items.map(([x0, y0, x1, y1]) => [x0, y0, x1 - x0, y1 - y0]));
}
// 사진인지 판단 (그림 단위): 이미지 조각들의 픽셀 중 흰색에 가까운 게 35% 이상이면 그래프·도표로 봄

// (단어 끝 한 글자만 걸친 쪽은 버리고, 단어 중간에서 시작/끝나면 단어 전체로)

  R = snapToWords(R); sel.removeAllRanges(); sel.addRange(R);   // 보정된 범위를 화면에도 표시

/* ════════════════ 6. 밑줄 만들기 · 선택 툴바 · 툴팁 · 편집 팝업 ════════════════ */
const tb = $("#tb"), tip = $("#tip"), pop = $("#pop");
let pending = null;   // 현재 본문 선택 {text, ranges | pdf}
let popA = null;      // 팝업에서 편집 중인 밑줄

const getPending = () => {

};
function hideTb() { tb.classList.remove("on"); pending = null; }
function showTb() {

  tb.classList.add("on");

}
tb.addEventListener("mousedown", e => e.preventDefault());
tb.addEventListener("click", e => { const b = e.target.closest("button"); if (b) runAct(b.dataset.act); });

// act: "ul"(마지막 색) | "hl_r" | "hl_b" | "hl_g" | "note"
function runAct(act) {

  else {
    if (act !== "ul") lastColor = act.slice(3);
    const a = {id: uid(), type: "ul", color: lastColor, ...pending, comment: "", t: Date.now()};
    meta.annots.push(a); rerender(a); touch(); renderLists();
    if (hasMemo(a)) setTimeout(() => openPop(a, true));   // 빨강(개념)·파랑(단어)은 바로 필기

}

  if (!meta) return;
  const p = getPending();
  if (p) { pending = p; hidePop(); showTb(); return; }
  hideTb();
  const mark = e.target.closest?.("mark.an");
  const a = isPdfView() ? hitPdf(e.clientX, e.clientY).at(-1) : mark && annotsOf(mark).at(-1);
  if (a) openPop(a);
}));

// 마우스를 올리면 필기·뜻 보여주기
const hideTip = () => tip.style.display = "none";
function showTip(list, r) {

  tip.innerHTML = list.map(a => `<div class="tc"><div class="tq">“${esc(a.text.slice(0, 80))}”</div>${esc(a.comment)}</div>`).join("");
  tip.style.display = "block"; place(tip, r);
}
let tipRaf = 0;

  if (!meta || tipRaf) return;
  const {clientX: x, clientY: y, target} = e;
  tipRaf = requestAnimationFrame(() => {

      const m = (!edPre && v.match(/^(#{1,3}|>|[-*]|\d+\.|\[ ?\]) /)) || (/^[-*] $/.test(edPre) && v.match(/^(\[ ?\]) /));
      if (m && c === m[0].length) { edPre = m[1][0] === "[" ? "- [ ] " : m[1] + " "; return reopen(0, v.slice(c)); }
    }
    autosize(ta); updPrev(ta, pv); save();
  });
  const gen = nGen;   // 같은 블록을 다시 그린 경우엔 편집을 끝내지 않음
  ta.addEventListener("blur", () => setTimeout(() => { if (gen === nGen && document.activeElement !== ta && ed === i) { ed = -1; renderNotes(); } }));
  ta.parentElement.querySelector(".emk input")?.addEventListener("mousedown", e => {
    e.preventDefault(); edPre = edPre.replace(/\[( |x|X)\]/, x => x === "[ ]" ? "[x]" : "[ ]"); reopen(ta.selectionStart);
  });

  ta.addEventListener("paste", e => {
    const cd = e.clipboardData; if (!cd) return;
    const imgs = [...cd.files].filter(f => f.type.startsWith("image/"));
    if (imgs.length) { e.preventDefault(); return insertImages(imgs, i); }
    const txt = cd.getData("text/plain");   // 빈 줄로 나뉜 여러 문단 → 블록 여러 개
    if (!/\n\s*\n/.test(txt) || ta.value.startsWith("```")) return;
    e.preventDefault();
    const parts = txt.replace(/\r/g, "").split(/\n\s*\n/), v = ta.value;
    parts[0] = edInd + edPre + v.slice(0, ta.selectionStart) + parts[0];
    const caret = splitBlock(parts.at(-1)).body.length;
    parts[parts.length - 1] += v.slice(ta.selectionEnd) + edSuf;
    meta.notes.splice(i, 1, ...parts); touch(); focusBlock(i + parts.length - 1, caret);
  });

  ta.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return;

      e.preventDefault();

      else if (/^\$[\s\S]+\$$/.test(sel)) setVal(ta, v.slice(0, s) + sel.slice(1, -1) + v.slice(en), s + sel.length - 2);
      else setVal(ta, v.slice(0, s) + "$" + sel + "$" + v.slice(en), s + sel.length + 2);

    }
    if (mod && !e.shiftKey && (k === "b" || k === "i")) {   // 굵게 / 기울임
      e.preventDefault(); const w = k === "b" ? "**" : "*";

      const lvl = edInd.length >> 1, prevLvl = i > 0 ? splitBlock(meta.notes[i - 1]).ind.length >> 1 : -1;
      if (e.shiftKey ? !lvl : lvl > prevLvl) return;

    }
    if (k === "Enter" && !e.shiftKey) {
      const tv = v.trim();
      if (inCode || (tv.startsWith("$$") && !(tv.length > 3 && tv.endsWith("$$")))) return;   // 코드·블록 수식 안: 줄바꿈
      e.preventDefault();
      if (isListPre(edPre) && !tv) { if (edInd) edInd = edInd.slice(2); else edPre = ""; return reopen(0); }   // 빈 목록 항목 → 내어쓰기
      const n = edPre.match(/^(\d+)\./), pre = !isListPre(edPre) ? "" : n ? (+n[1] + 1) + ". " : edPre.replace(/\[[xX]\]/, "[ ]");
      meta.notes[i] = edInd + edPre + v.slice(0, s) + edSuf;
      meta.notes.splice(i + 1, 0, edInd + pre + v.slice(en)); touch();
      return focusBlock(i + 1, 0);
    }
    if (k === "Backspace" && s === 0 && en === 0) {
      if (edPre) { e.preventDefault(); edPre = ""; return reopen(0); }                 // 접두어 제거 → 일반 블록
      if (edInd) { e.preventDefault(); edInd = edInd.slice(2); return reopen(0); }     // 내어쓰기
      if (i === 0) return;
      e.preventDefault();
      if (isImgBlock(meta.notes[i - 1])) { if (!v) { meta.notes.splice(i, 1); touch(); } return selectOnly(i - 1); }
      const prev = meta.notes[i - 1], ps = (prev.match(SUF) || [""])[0], caret = splitBlock(prev).body.length - ps.length;
      meta.notes[i - 1] = prev.slice(0, prev.length - ps.length) + v + (ps || edSuf);   // 앞 블록과 합치기
      meta.notes.splice(i, 1); touch();
      return focusBlock(i - 1, caret);
    }
    if (k === "ArrowUp" && i > 0 && !v.slice(0, s).includes("\n")) { e.preventDefault(); focusBlock(i - 1); }
    if (k === "ArrowDown" && i < meta.notes.length - 1 && !v.slice(en).includes("\n")) { e.preventDefault(); focusBlock(i + 1, 0); }
  });
}

// 선택된 블록 키보드: Del 삭제 · Esc 해제 · Enter 편집 · ↑↓ 이동(Shift 범위) · Ctrl+Shift+↑↓ 묶어서 이동 · Ctrl+C 복사
function onSelKey(e) {
  const idx = [...selSet].sort((a, b) => a - b), N = meta.notes.length, a0 = idx[0], a1 = idx.at(-1), k = e.key, mod = e.ctrlKey || e.metaKey;
  if (k === "Delete" || k === "Backspace") { e.preventDefault(); return deleteBlocks(idx); }
  if (k === "Escape") return clearSel();
  if (mod && k.toLowerCase() === "c") {
    e.preventDefault(); navigator.clipboard.writeText(idx.map(i => meta.notes[i]).join("\n\n")).then(() => toast("블록을 복사했어요"), () => {}); return;
  }
  if (k === "Enter") { if (idx.length === 1 && !isImgBlock(meta.notes[a0])) { e.preventDefault(); focusBlock(a0); } return; }
  if (k !== "ArrowUp" && k !== "ArrowDown") return;
  e.preventDefault(); const up = k === "ArrowUp";
  if (mod && e.shiftKey) {
    if (up ? a0 === 0 : a1 === N - 1) return;
    const ins = moveGroup(a0, idx.length, a0 + (up ? -1 : 1));
    selSet = new Set(idx.map((_, j) => ins + j)); selAnchor = ins; renderNotes();
    notesEl.querySelector(`.nb[data-i="${up ? ins : ins + idx.length - 1}"]`)?.scrollIntoView({block: "nearest"});
    return;
  }
  if (e.shiftKey) { const t = (selAnchor === a0 ? a1 : a0) + (up ? -1 : 1); if (t >= 0 && t < N) selectBlocks(selAnchor < 0 ? a0 : selAnchor, t); return; }
  const t = up ? a0 - 1 : a1 + 1; if (t < 0 || t >= N) return;
  isImgBlock(meta.notes[t]) ? selectBlocks(t, t) : focusBlock(t, up ? null : 0);
}

// 블록 끌어서 이동 (⋮⋮ 손잡이). 여러 블록이 선택된 상태면 함께 이동
let dragFrom = null;
const clearDropMarks = () => notesEl.querySelectorAll(".drop-b,.drop-a").forEach(x => x.classList.remove("drop-b", "drop-a"));
function dropSpot(y) {   // 마우스 높이 기준 놓을 자리
  const bs = [...notesEl.querySelectorAll(".nb")];
  for (const b of bs) { const r = b.getBoundingClientRect(); if (y < r.top + r.height / 2) return {el: b, at: +b.dataset.i, before: true}; }
  return {el: bs.at(-1), at: +bs.at(-1).dataset.i + 1, before: false};
}
notesEl.addEventListener("dragstart", e => {
  const blk = e.target.closest?.(".hd")?.closest(".nb"); if (!blk) return;
  dragFrom = +blk.dataset.i;
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/x-pn-block", String(dragFrom));
  try { e.dataTransfer.setDragImage(blk, 10, 10); } catch {}
  blk.classList.add("dragging");
});
notesEl.addEventListener("dragend", () => { dragFrom = null; clearDropMarks(); notesEl.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); });
notesEl.addEventListener("dragover", e => {
  if (dragFrom === null) { if (meta && hasFiles(e)) e.preventDefault(); return; }
  e.preventDefault(); e.dataTransfer.dropEffect = "move"; clearDropMarks();
  const pane = $("#p-notes"), pr = pane.getBoundingClientRect(), edge = 60;   // 위·아래 가장자리에서 자동 스크롤
  if (e.clientY < pr.top + edge) pane.scrollTop -= Math.ceil((pr.top + edge - e.clientY) / 3);
  else if (e.clientY > pr.bottom - edge) pane.scrollTop += Math.ceil((e.clientY - pr.bottom + edge) / 3);
  const sp = dropSpot(e.clientY); sp.el.classList.add(sp.before ? "drop-b" : "drop-a");
});
notesEl.addEventListener("drop", e => {

    const from = dragFrom; dragFrom = null; clearDropMarks();
    const grp = selSet.size > 1 && selSet.has(from) ? [...selSet].sort((a, b) => a - b) : [from];
    const a0 = grp[0], a1 = grp.at(-1); let ins = dropSpot(e.clientY).at;
    if (ins >= a0 && ins <= a1 + 1) return;
    if (ins > a1) ins -= grp.length;
    moveGroup(a0, grp.length, ins);
    selSet = new Set(grp.length > 1 ? grp.map((_, k) => ins + k) : []); selAnchor = selSet.size ? ins : -1;
    ed = -1; return renderNotes();
  }
  const imgs = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/")); if (!meta || !imgs.length) return;
  e.preventDefault(); const blk = e.target.closest(".nb");
  insertImages(imgs, blk ? +blk.dataset.i : ed);
});

// 마우스: 클릭 → 편집, 세로로 끌기 → 블록 범위 선택, 체크박스 토글, 원문 링크
notesEl.addEventListener("click", e => { const j = e.target.closest("a.jump"); if (j) { e.preventDefault(); jumpTo(j.dataset.loc); } });
let mdrag = null;
notesEl.addEventListener("mousedown", e => {

    lines[+cb.dataset.line] = lines[+cb.dataset.line].replace(/\[( |x|X)\]/, m => m === "[ ]" ? "[x]" : "[ ]");
    meta.notes[i] = lines.join("\n"); touch(); return renderNotes();
  }
  if (e.target.closest("a")) return;
  if (blk?.classList.contains("e")) { clearSel(); mdrag = {y0: e.clientY, i0: +blk.dataset.i, moved: false, ta: true}; return; }   // 편집 중: 블록 밖으로 끌면 블록 선택
  e.preventDefault();
  if (e.shiftKey && blk && selAnchor >= 0) return selectBlocks(selAnchor, +blk.dataset.i);
  mdrag = {y0: e.clientY, i0: blk ? +blk.dataset.i : null, moved: false, ta: false};
});
addEventListener("mousemove", e => {
  if (!mdrag || !(e.buttons & 1)) return;
  if (!mdrag.moved) {

      const r = notesEl.querySelector(`.nb[data-i="${mdrag.i0}"]`)?.getBoundingClientRect();
      if (r && e.clientY >= r.top - 2 && e.clientY <= r.bottom + 2) return;

    } else if (Math.abs(e.clientY - mdrag.y0) < 6) return;
    mdrag.moved = true; notesEl.classList.add("selecting");
    if (ed >= 0) { ed = -1; renderNotes(); }

  }
  selectByY(mdrag.y0, e.clientY);
});
addEventListener("mouseup", () => {
  if (!mdrag) return; const d = mdrag; mdrag = null; notesEl.classList.remove("selecting");
  if (d.moved || d.ta) return;
  if (d.i0 !== null) return isImgBlock(meta.notes[d.i0]) ? selectBlocks(d.i0, d.i0) : focusBlock(d.i0);
  clearSel();   // 빈 곳 클릭 → 마지막 빈 블록에서 이어 쓰기
  const n = meta.notes; if (n.at(-1).trim() || isImgBlock(n.at(-1))) { n.push(""); touch(); }
  focusBlock(n.length - 1);

function quoteToNotes(text, comment, loc) {
  if (!meta) return;
  const lbl = loc[0] === "p" ? "p. " + loc.slice(1).split("-")[0] : "본문";
  const add = ["> " + text.replace(/\s*\n\s*/g, " ") + (loc ? ` [${lbl}](#pn-${loc})` : "")];
  if (comment?.trim()) add.push(comment.trim());
  if (meta.notes.length === 1 && !meta.notes[0].trim()) meta.notes = add; else meta.notes.push(...add);
  meta.notes.push(""); touch(); switchTab("notes"); focusBlock(meta.notes.length - 1);
}

/* ════════════════ 11-1. 찾기 (Ctrl+F) ════════════════
 * 본문(PDF는 아직 안 그린 쪽까지) · 노트 · 개념/단어 필기를 한 번에 찾음.
 * 브라우저 기본 찾기는 안 그린 PDF 쪽이나 다른 탭에 숨은 필기를 못 찾아서 직접 구현.
 * 찾은 위치는 CSS Highlight API로 표시 (DOM을 건드리지 않음) */
const fq = $("#fq");
let found = [], foundAt = -1, findTimer = null, pageTexts = new Map();
// 찾는 범위: 전체 · 본문 · 노트 · 필기. 찾기는 늘 전부 하고(allFound) 범위에 맞는 것만 오가며 봄
let allFound = [], findScope = ls.get("pn:fscope") || "all";
const SCOPES = {all: "전체", doc: "본문", note: "노트", memo: "필기"};
const scopeOf = f => f.kind === "pdf" ? "doc" : f.kind;
const lc = s => s.toLowerCase();
const FIND_SKIP = ".hd, mjx-container";   // 노트의 ⋮⋮ 손잡이, 수식 그림은 제외
function textNodes(root) {   // root 안 글자 조각들과, 이어 붙인 전체 글자
  const nodes = [], tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n, text = "";
  while ((n = tw.nextNode())) { if (n.parentElement?.closest(FIND_SKIP)) continue; nodes.push([n, text.length]); text += n.data; }
  return [nodes, text];
}
function countIn(text, q) { let c = 0, i = 0; text = lc(text); while ((i = text.indexOf(q, i)) >= 0) { c++; i += q.length; } return c; }
function rangeOf(root, q, j) {   // root 안에서 q의 j번째 위치 → Range
  const [nodes, raw] = textNodes(root), text = lc(raw);
  let i = text.indexOf(q); for (let k = 0; k < j && i >= 0; k++) i = text.indexOf(q, i + q.length);
  if (i < 0) return null;
  const at = pos => { for (let k = nodes.length - 1; k >= 0; k--) if (nodes[k][1] <= pos) return [nodes[k][0], pos - nodes[k][1]]; };
  const r = document.createRange(); r.setStart(...at(i)); r.setEnd(...at(i + q.length));
  return r;
}
// PDF 쪽 글자 = 텍스트 레이어에 그려질 글자 조각을 이어 붙인 것 (그래서 쪽을 그린 뒤 같은 순번으로 찾을 수 있음)
async function pageText(p) {
  if (pageTexts.doc !== pdfDoc) pageTexts = Object.assign(new Map(), {doc: pdfDoc});
  if (!pageTexts.has(p)) pageTexts.set(p, (await (await pdfDoc.getPage(p)).getTextContent()).items.map(it => it.str).join(""));
  return pageTexts.get(p);
}
async function collect(q) {   // 찾은 위치 목록: 본문 → 노트 → 개념·단어 필기 순
  const out = [], add = (n, f) => { for (let j = 0; j < n; j++) out.push({...f, j}); };
  if (isPdfView()) for (let p = 1; p <= pdfDoc.numPages; p++) add(countIn(await pageText(p), q), {kind: "pdf", p});
  else blocks.forEach((b, i) => b.k === "p" && add(countIn(b.t, q), {kind: "doc", i}));
  notesEl.querySelectorAll(".nb").forEach(d => add(countIn(textNodes(d)[1], q), {kind: "note", i: +d.dataset.i}));
  // 필기: 개념·단어 탭 항목마다 밑줄 그은 단어/구절(.q/.w) → 적어 둔 필기(.c) 순
  for (const [tab, c] of [["concept", "r"], ["vocab", "b"]]) for (const a of byColor(meta, c)) {
    add(countIn(a.text, q), {kind: "memo", tab, id: a.id, sel: ".q, .w"});
    add(countIn(a.comment || "", q), {kind: "memo", tab, id: a.id, sel: ".c"});
  }
  return out;
}

function openFind() {
  if (ed >= 0) { ed = -1; renderNotes(); }   // 편집 중인 노트 블록도 찾을 수 있게 닫음
  const fb = $("#findbar"), s = getSelection().toString().trim();
  if (s && s.length < 80 && !s.includes("\n")) fq.value = s;
  fb.hidden = false; fq.focus(); fq.select();
  if (fq.value.trim()) runFind();
}
function closeFind() {
  $("#findbar").hidden = true; found = allFound = []; foundAt = -1; clearTimeout(findTimer);
  CSS.highlights?.delete("pn-find"); updScopes();
}
async function runFind() {
  clearTimeout(findTimer); findTimer = null;
  const q = lc(fq.value.trim()); found = allFound = []; foundAt = -1; CSS.highlights?.delete("pn-find");
  if (!q || !meta) { $("#fcount").textContent = ""; return updScopes(); }
  const res = await collect(q);
  if (lc(fq.value.trim()) !== q) return;   // 찾는 동안 검색어가 바뀜
  allFound = res; applyScope();
}
// 범위 버튼: 고른 범위 표시 + 범위마다 찾은 개수
function updScopes() {
  $$("#findbar [data-s]").forEach(b => {
    const s = b.dataset.s, n = s === "all" ? allFound.length : allFound.filter(f => scopeOf(f) === s).length;
    b.classList.toggle("on", s === findScope);
    b.innerHTML = SCOPES[s] + (fq.value.trim() ? `<small>${n}</small>` : "");
  });
}
function applyScope() {
  found = findScope === "all" ? allFound : allFound.filter(f => scopeOf(f) === findScope);
  foundAt = -1; CSS.highlights?.delete("pn-find"); updScopes();
  if (found.length) showFound(0); else $("#fcount").textContent = fq.value.trim() ? "없음" : "";
}
async function showFound(k) {
  if (!found.length) return;
  foundAt = (k + found.length) % found.length;
  const f = found[foundAt], q = lc(fq.value.trim()), me = foundAt;
  $("#fcount").textContent = `${foundAt + 1}/${found.length}`;
  let root;
  if (f.kind === "doc") root = blockEl(f.i);
  else if (f.kind === "pdf") {   // 아직 안 그린 쪽이면 그 쪽으로 가서 그려질 때까지 기다림
    const pg = doc.querySelector(`.page[data-page="${f.p}"]`); if (!pg) return;
    if (!pg.querySelector(".textLayer span")) {
      reader.scrollTop = pg.offsetTop - 20;
      renderPage(pg, pdfDoc);   // 화면에 들어와 그려지길 기다리지 않고 바로 그림 (이미 그리는 중이면 무시됨)
      for (let t = 0; t < 50 && !pg.querySelector(".textLayer span"); t++) await new Promise(r => setTimeout(r, 100));
      if (me !== foundAt) return;
    }
    root = pg.querySelector(".textLayer");
  } else if (f.kind === "note") { switchTab("notes"); root = notesEl.querySelector(`.nb[data-i="${f.i}"]`); }
  else { switchTab(f.tab); root = $(`#l-${f.tab} .ai[data-id="${f.id}"]`)?.querySelector(f.sel); }
  const r = root && rangeOf(root, q, f.j); if (!r) return;
  CSS.highlights?.set("pn-find", new Highlight(r));
  // 찾은 곳이 화면 위쪽 1/3쯤 오게 스크롤 (본문은 왼쪽, 노트·필기는 오른쪽 패널)
  const box = f.kind === "doc" || f.kind === "pdf" ? reader : root.closest(".pane");
  const rr = r.getBoundingClientRect(), br = box.getBoundingClientRect();
  const left = rr.left < br.left || rr.right > br.right ? rr.left - br.left - box.clientWidth / 3 : 0;
  box.scrollBy({top: rr.top - br.top - box.clientHeight / 3, left});
}
fq.addEventListener("input", () => { clearTimeout(findTimer); findTimer = setTimeout(runFind, 250); });
fq.addEventListener("keydown", async e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Escape") { e.preventDefault(); return closeFind(); }
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (findTimer || !found.length) return runFind();   // 입력 직후라 아직 안 찾았으면 지금 찾기
  showFound(foundAt + (e.shiftKey ? -1 : 1));
});
$("#findbar").addEventListener("click", e => {
  const s = e.target.closest("[data-s]");
  if (s) { findScope = s.dataset.s; ls.set("pn:fscope", findScope); fq.focus(); return findTimer ? runFind() : applyScope(); }
  const b = e.target.closest("[data-f]"); if (!b) return;

/* ════════════════ 15. 텍스트 추출 (PDF → 문단) ════════════════ */
const clean = s => s.replace(/ﬁ/g, "fi").replace(/ﬂ/g, "fl").replace(/ﬀ/g, "ff").replace(/ﬃ/g, "ffi").replace(/[ \t ]+/g, " ").trim();
function textToBlocks(txt) {
  txt = txt.replace(/\r/g, "");
  let parts = txt.split(/\n\s*\n/);
  if (parts.length === 1 && txt.split("\n").length > 3) parts = txt.split("\n");
  return parts.map(p => clean(p.replace(/-\n(?=[a-z])/g, "").replace(/\n/g, " "))).filter(Boolean).map(t => ({k: "p", t}));
}
async function pdfToBlocks(pdf, onProgress) {
  const out = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    onProgress?.(n, pdf.numPages);
    const page = await pdf.getPage(n), W = page.getViewport({scale: 1}).width;
    const items = (await page.getTextContent()).items.filter(it => it.str?.trim())
      .map(it => ({x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || it.height || 10, s: it.str}));
    if (!items.length) continue;
    // 2단 편집 감지: 왼쪽·오른쪽 단에 글자가 고루 있으면 (가로지르는 것 → 왼쪽 → 오른쪽) 순서로
    const mid = W / 2, chars = a => a.reduce((s, i) => s + i.s.length, 0), tot = chars(items);
    const L = items.filter(i => i.x + i.w <= mid + 6), R = items.filter(i => i.x >= mid - 6 && i.x + i.w > mid + 6);
    const S = items.filter(i => !L.includes(i) && !R.includes(i));
    const groups = chars(L) > tot * .25 && chars(R) > tot * .25 && chars(S) < tot * .2 ? [S, L, R].filter(g => g.length) : [items];
    out.push({k: "g", t: `p. ${n}`});
    groups.forEach(g => paras(lines(g)).forEach(t => out.push({k: "p", t})));
  }
  return out;
}
function lines(items) {   // 글자 조각 → 줄
  const L = [];
  for (const it of [...items].sort((a, b) => b.y - a.y || a.x - b.x)) {
    const ln = L.at(-1);
    if (ln && Math.abs(ln.y - it.y) < Math.max(2, it.h * .5)) ln.items.push(it); else L.push({y: it.y, items: [it]});
  }
  return L.map(l => {
    l.items.sort((a, b) => a.x - b.x);
    let s = "", end = null;
    for (const it of l.items) {
      if (end !== null && it.x - end > it.h * .15 && !/\s$/.test(s) && !/^\s/.test(it.s)) s += " ";
      s += it.s; end = it.x + it.w;
    }
    return {y: l.y, x0: l.items[0].x, x1: end, h: Math.max(...l.items.map(i => i.h)), s: clean(s)};
  }).filter(l => l.s);
}
function paras(L) {   // 줄 → 문단 (줄 간격·글자 크기·문장 끝으로 판단)
  if (!L.length) return [];
  const gaps = []; for (let k = 1; k < L.length; k++) { const g = L[k - 1].y - L[k].y; if (g > 0) gaps.push(g); }
  gaps.sort((a, b) => a - b);
  const med = gaps.length ? gaps[Math.floor(gaps.length * .3)] : 12;   // 하위 30% = 보통 줄 간격
  const maxW = Math.max(...L.map(l => l.x1 - l.x0)), out = [];
  let cur = L[0].s;
  for (let k = 1; k < L.length; k++) {
    const p = L[k - 1], l = L[k], g = p.y - l.y;
    if (g > med * 1.45 || g < 0 || Math.abs(l.h - p.h) > 1.2 || (/[.!?:。]$/.test(p.s) && p.x1 - p.x0 < maxW * .8)) { out.push(cur); cur = l.s; }
    else if (/[A-Za-z]-$/.test(cur) && /^[a-z]/.test(l.s)) cur = cur.slice(0, -1) + l.s;   // 하이픈 줄바꿈 잇기
    else cur += " " + l.s;
  }
  out.push(cur);
  return out.map(clean).filter(t => t && !/^\d{1,4}$/.test(t));   // 쪽 번호만 있는 줄 제거
}

/* ════════════════ 16. 내보내기 · 가져오기 ════════════════ */
function exportMd(m = meta) {
  // Notion 가져오기 호환: ==강조== → **굵게**, 목록 아닌 블록의 들여쓰기 제거(코드블록이 되므로), 원문 링크 → (p. 3)
  const notes = m.notes.filter(n => n.trim()).map(n => {
    if (/^```/.test(n.trim())) return n;
    const {pre, body} = splitBlock(n); if (!isListPre(pre)) n = pre + body;
    return n.replace(/\s*\[([^\]]*)\]\(#pn-([^)\s]+)\)/g, (_, l, loc) => loc[0] === "p" ? ` (${l})` : "").replace(/==(.+?)==/g, "**$1**");
  }).join("\n\n");
  const one = s => s.replace(/\s*\n\s*/g, " ");
  const quotes = list => list.flatMap(a => ["> " + one(a.text), ...(hasMemo(a) && a.comment?.trim() ? ["", a.comment.trim()] : []), ""]);
  const parts = [`# ${m.title}`, "", "## 노트", "", notes, "", "## 밑줄", "", ...quotes(byColor(m, "g"))];
  const concepts = byColor(m, "r"), vocab = byColor(m, "b");
  if (concepts.length) parts.push("## 개념", "", ...quotes(concepts));
  if (vocab.length) parts.push("## 단어", "", ...vocab.map(a => `- **${a.text.replace(/\s+/g, " ")}**` + (a.comment?.trim() ? " — " + one(a.comment.trim()) : "")), "");
  return parts.join("\n");
}

  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

  [b.textContent, b.title] = Store.dir ? ["📁 " + Store.dir.name, `저장 폴더: ${Store.dir.name} (클릭하면 다른 위치로 변경)`]
    : Store.pendingDir ? ["📁 폴더 다시 연결", "저장 폴더 접근 허용"]
    : ["📁 폴더 연결", `앱(HTML)이 있는 위치를 선택 — 그 안에 ${DATA_DIR} 폴더가 생기고 논문마다 폴더가 만들어져요`];
}
$("#bDir").addEventListener("click", async e => {
  try {
    await flush();
    if (!(await Store.connect(!Store.pendingDir || e.shiftKey))) return toast("폴더 접근이 허용되지 않았어요");
    await reloadLibrary(); toast("📁 " + Store.dir.name + " 폴더에 저장돼요");
  } catch (err) { if (err?.name !== "AbortError") toast("폴더를 연결하지 못했어요"); }
});

/* ════════════════ 18. 테마 (다크 모드) ════════════════
 * 직접 고르면 저장하고, 고른 적 없으면 시스템 설정을 따라감 */
function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  $("#bTheme").textContent = t === "dark" ? "☀️" : "🌙";
  $("#bTheme").title = t === "dark" ? "밝은 모드로" : "다크 모드로";
  if (save) ls.set("pn:theme", t);
}
$("#bTheme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => { if (!ls.get("pn:theme")) setTheme(e.matches ? "dark" : "light"); });
setTheme(document.documentElement.dataset.theme || "light");

/* ════════════════ 19. 시작 ════════════════ */
(async () => {
  renderDoc(); renderNotes();
  try { await Store.init(); } catch { return setStatus("브라우저 저장소를 열 수 없어요", true); }
  updDirBtn();
  if (Store.pendingDir) { showPaper(); return setStatus("폴더 접근 허용 필요"); }
  await reloadLibrary();
})();
})();
</script>
</body>
</html>
